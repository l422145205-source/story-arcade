name: Story checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Reproduce choices, retries, relay and branches
        run: python tools/reproduce.py --out work/ci-demo
      - uses: actions/upload-artifact@v4
        with:
          name: story-demo-${{ matrix.os }}
          path: work/ci-demo
